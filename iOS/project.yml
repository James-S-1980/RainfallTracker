name: RainfallTracker
options:
  bundleIdPrefix: com.jamesschliesske
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: '1'
targets:
  RainfallTracker:
    type: application
    platform: iOS
    sources:
      - path: RainfallTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesschliesske.RainfallTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rainfall Tracker
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to your Rainfall Tracker data service on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
